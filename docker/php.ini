; Same limits the Nixpacks start script set through PHPRC (applies to php-fpm
; and to the CLI processes: Reverb and artisan).
memory_limit = 512M
post_max_size = 30M
upload_max_filesize = 25M
; Interim mitigation for CVE-2026-109619 (kept as defence in depth on patched PHP).
session.upload_progress.enabled = Off
expose_php = Off
